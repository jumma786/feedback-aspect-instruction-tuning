name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        # CPU wheels only. The runners have no GPU and the test suite is
        # written to run on CPU, so pulling the CUDA build would add gigabytes
        # of download for no benefit.
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers peft datasets numpy pytest pytest-cov ruff

      - name: Lint
        run: ruff check src tests

      - name: Run tests with coverage
        # The dataset-dependent tests are skipped here: CI should not depend on
        # a third-party download staying available.
        run: pytest --cov=src --cov-report=term-missing --cov-report=xml
